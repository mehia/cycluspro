<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cyclus</title>
<meta name="description" content="Rastreador diário de hábitos, mês a mês.">
<meta name="theme-color" content="#ff7a1a">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="cyclus">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/fav-icon.png" type="image/png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Sora:wght@400;600;700&display=swap">
<style>
  :root{
    --bg-0:#050505;
    --bg-1:#0e0e0e;
    --bg-2:#161616;
    --panel:#131313;
    --panel-2:#0a0a0a;
    --line:#332a20;
    --ink:#f5efe8;
    --ink-dim:#c9b8a4;
    --ink-faint:#8a7a68;
    --accent:#ff8a2b;
    --accent-2:#e05e00;
    --done:#4fd67a;
    --done-ink:#06210f;
    --miss:#ff5d6c;
    --miss-ink:#2a0508;
    --empty:#1e1a15;
  }
  *{box-sizing:border-box;}
  html{min-height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 700px at 15% -10%, #ff8a2b33, transparent 60%),
      radial-gradient(900px 600px at 100% 0%, #e05e0022, transparent 55%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1) 40%, var(--bg-2));
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Sora', system-ui, sans-serif;
    padding:calc(32px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-right,0px)) calc(60px + env(safe-area-inset-bottom,0px)) calc(20px + env(safe-area-inset-left,0px));
    min-height:100%;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:1180px;margin:0 auto;}

  header.top{
    display:flex;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:28px;
  }
  .capi{
    width:56px;height:56px;flex:none;
    border-radius:16px;
    background:linear-gradient(155deg, var(--accent-2), #7a2e00);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 24px -8px #e05e0090, inset 0 0 0 1px #ffffff22;
  }
  .capi img{width:34px;height:34px;object-fit:contain;display:block;}
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(26px,4vw,38px);
    letter-spacing:0.3px;
    margin:0;
    line-height:1.05;
  }
  h1 em{font-style:normal;color:var(--accent);}
  .sub{color:var(--ink-dim);font-size:14px;margin-top:4px;}

  .toprow{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  select, button.ghost{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:10px;
    padding:9px 14px;
    font-family:inherit;
    font-size:13px;
    cursor:pointer;
  }
  button.ghost:hover{border-color:var(--accent);}
  button.ghost:focus-visible, select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .stats{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(150px,1fr));
    gap:12px;
    margin-bottom:26px;
  }
  .stat{
    background:linear-gradient(160deg, var(--panel), var(--panel-2));
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 18px;
  }
  .stat .num{
    font-family:'Fraunces', serif;
    font-size:28px;
    font-variant-numeric:tabular-nums;
    color:var(--accent);
    line-height:1;
  }
  .stat .lbl{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-faint);
    margin-top:6px;
  }
  .stat.hero{background:linear-gradient(155deg, var(--accent-2), #7a2e00); border-color:#ff8a2b80;}
  .stat.hero .num{color:#fff;}
  .stat.hero .lbl{color:#ffe3cccc;}

  table.board{
    width:100%;
    border-collapse:collapse;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 20px 50px -25px #000000aa;
  }
  thead th{
    background:linear-gradient(180deg,#1c1712,#100d0a);
    color:var(--ink);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.07em;
    padding:10px 4px;
    text-align:center;
    font-weight:600;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
  }
  thead th:first-child{text-align:left;padding-left:18px;min-width:170px;}
  tbody tr:not(:last-child) td, tbody tr:not(:last-child) th{border-bottom:1px solid #2a2018;}
  tbody tr:hover{background:#ffffff06;}
  th.habitname{
    text-align:left;
    padding:14px 10px 14px 18px;
    vertical-align:middle;
  }
  .habit-name-input{
    background:transparent;
    border:none;
    color:var(--ink);
    font-family:inherit;
    font-weight:600;
    font-size:13.5px;
    width:100%;
    padding:4px 2px;
    border-radius:6px;
  }
  .habit-name-input:hover, .habit-name-input:focus{background:#ffffff0c;}
  .habit-name-input:focus-visible{outline:1px solid var(--accent);}
  .rowmeta{font-size:10.5px;color:var(--ink-faint);margin-top:2px;font-variant-numeric:tabular-nums;}

  td.cell{padding:3px;text-align:center;}
  .dot{
    width:22px;height:22px;
    margin:0 auto;
    border-radius:50%;
    border:1.5px solid #4a3a2a;
    background:var(--empty);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-size:9.5px;
    font-weight:700;
    color:#a3927e;
    font-variant-numeric:tabular-nums;
    transition:transform .12s ease, background .12s ease, border-color .12s ease;
    user-select:none;
  }
  .dot:hover{transform:scale(1.12); border-color:var(--accent);}
  .dot:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .dot.done{background:var(--done); border-color:var(--done); color:var(--done-ink);}
  .dot.miss{background:var(--miss); border-color:var(--miss); color:var(--miss-ink);}

  th.daynum{color:var(--ink-faint); font-weight:600;}
  th.daynum.today{color:#fff; background:linear-gradient(180deg,#7a3a00,#4a2200);}

  .del-col{width:34px;text-align:center;}
  .del-btn{
    background:none;border:none;color:var(--ink-faint);
    cursor:pointer;font-size:15px;line-height:1;padding:4px;border-radius:6px;
  }
  .del-btn:hover{color:var(--miss); background:#ffffff0c;}

  .addrow{
    display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;
  }
  .addrow input[type=text]{
    flex:1;min-width:200px;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:10px;
    padding:10px 14px;
    font-family:inherit;
    font-size:13.5px;
  }
  .addrow input[type=text]:focus-visible{outline:2px solid var(--accent);}
  .addrow button{
    background:linear-gradient(150deg, var(--accent), var(--accent-2));
    border:none;color:#fff;font-weight:700;font-size:13px;
    border-radius:10px;padding:10px 20px;cursor:pointer;
    box-shadow:0 8px 20px -8px #ff8a2ba0;
  }
  .addrow button:hover{filter:brightness(1.08);}

  .legend{
    display:flex;gap:22px;flex-wrap:wrap;
    margin-top:20px;
    font-size:12.5px;color:var(--ink-dim);
  }
  .legend span{display:inline-flex;align-items:center;gap:8px;}
  .swatch{width:14px;height:14px;border-radius:50%;display:inline-block;}
  .swatch.done{background:var(--done);}
  .swatch.miss{background:var(--miss);}
  .swatch.empty{background:var(--empty); border:1.5px solid #4a3a2a;}

  .tablewrap{overflow-x:auto; border-radius:16px; -webkit-overflow-scrolling:touch;}

  @media (max-width:640px){
    body{padding-top:calc(20px + env(safe-area-inset-top,0px));}
    .toprow{margin-left:0;width:100%;}
    .toprow select{flex:1;}
  }

  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg-0:#fbf7f3; --bg-1:#f3e9dd; --bg-2:#ecdcc6;
      --panel:#ffffff; --panel-2:#faf3ea;
      --line:#e6cfae; --ink:#241a10; --ink-dim:#6b4f33; --ink-faint:#9c7c58;
      --accent:#e05e00; --accent-2:#b84800;
      --empty:#f1e2cd;
    }
  }
  :root[data-theme="dark"]{
    --bg-0:#050505; --bg-1:#0e0e0e; --bg-2:#161616;
    --panel:#131313; --panel-2:#0a0a0a; --line:#332a20;
    --ink:#f5efe8; --ink-dim:#c9b8a4; --ink-faint:#8a7a68;
    --accent:#ff8a2b; --accent-2:#e05e00; --empty:#1e1a15;
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="capi">
      <img src="icons/fav-icon.png" alt="" width="34" height="34">
    </div>
    <div>
      <h1><em>cyclus</em></h1>
      <div class="sub">Marque todos os dias. Seja sincero consigo mesmo.</div>
    </div>
    <div class="toprow">
      <select id="monthSelect"></select>
      <button class="ghost" id="resetMonth">Limpar mês</button>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="tablewrap">
    <table class="board" id="board"></table>
  </div>

  <div class="addrow">
    <input type="text" id="newHabit" placeholder="Adicionar novo hábito (ex: Leitura 20min)" maxlength="40">
    <button id="addHabitBtn">+ Adicionar hábito</button>
  </div>

  <div class="legend">
    <span><i class="swatch done"></i> Hábito feito</span>
    <span><i class="swatch miss"></i> Hábito não feito</span>
    <span><i class="swatch empty"></i> Ainda não marcado</span>
  </div>
</div>

<script>
(function(){
  var DEFAULT_HABITS = [
    "Zero açúcar",
    "Banho gelado",
    "Dieta da roça",
    "Stomach vacuum",
    "Treino de força",
    "1h de cardio ou lutas",
    "Envio checklist grupo",
    "Máximo 1h rede social/dia",
    "Sem vícios",
    "3L de água"
  ];

  var STORE_KEY = "capivara-habit-tracker-v1";

  function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
  function monthKey(y,m){ return y+"-"+String(m+1).padStart(2,"0"); }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return null;
  }
  function saveState(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
  }

  var now = new Date();
  var state = loadState();
  if(!state){
    state = {
      habits: DEFAULT_HABITS.map(function(name, i){ return {id: "h"+i+"-"+Date.now(), name: name}; }),
      marks: {},
      currentMonth: monthKey(now.getFullYear(), now.getMonth())
    };
    saveState();
  }
  if(!state.currentMonth) state.currentMonth = monthKey(now.getFullYear(), now.getMonth());

  function ensureMonthOptions(){
    var sel = document.getElementById("monthSelect");
    sel.innerHTML = "";
    var opts = [];
    var base = new Date();
    for(var i=-6;i<=6;i++){
      var d = new Date(base.getFullYear(), base.getMonth()+i, 1);
      opts.push(monthKey(d.getFullYear(), d.getMonth()));
    }
    if(opts.indexOf(state.currentMonth) === -1) opts.push(state.currentMonth);
    opts = opts.filter(function(v,i,a){return a.indexOf(v)===i;}).sort();
    var names = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
    opts.forEach(function(k){
      var parts = k.split("-");
      var y = parseInt(parts[0],10), m = parseInt(parts[1],10)-1;
      var label = names[m] + " " + parts[0];
      void y;
      var o = document.createElement("option");
      o.value = k; o.textContent = label;
      if(k === state.currentMonth) o.selected = true;
      sel.appendChild(o);
    });
    sel.onchange = function(){ state.currentMonth = sel.value; saveState(); render(); };
  }

  function getMark(habitId, day){
    var mk = state.currentMonth;
    return (state.marks[mk] && state.marks[mk][habitId] && state.marks[mk][habitId][day]) || "";
  }
  function setMark(habitId, day, val){
    var mk = state.currentMonth;
    if(!state.marks[mk]) state.marks[mk] = {};
    if(!state.marks[mk][habitId]) state.marks[mk][habitId] = {};
    if(val === "") delete state.marks[mk][habitId][day];
    else state.marks[mk][habitId][day] = val;
    saveState();
  }

  function cycle(v){
    if(v === "") return "done";
    if(v === "done") return "miss";
    return "";
  }

  /* Recalcula contadores e cartões sem redesenhar a grade inteira,
     para que o progresso mude no instante em que você marca um dia. */
  function paintTotals(nd){
    var totalDone = 0, totalMiss = 0;
    state.habits.forEach(function(h){
      var c = 0;
      for(var d=1; d<=nd; d++){
        var v = getMark(h.id, d);
        if(v === "done") c++;
        else if(v === "miss") totalMiss++;
      }
      totalDone += c;
      var meta = document.querySelector('.rowmeta[data-hid="'+h.id+'"]');
      if(meta) meta.textContent = c+"/"+nd+" dias";
    });

    var possible = state.habits.length * nd;
    var pct = possible ? Math.round((totalDone/possible)*100) : 0;
    document.getElementById("stats").innerHTML =
      '<div class="stat hero"><div class="num">'+pct+'%</div><div class="lbl">Progresso do mês</div></div>'+
      '<div class="stat"><div class="num">'+totalDone+'</div><div class="lbl">Hábitos feitos</div></div>'+
      '<div class="stat"><div class="num">'+totalMiss+'</div><div class="lbl">Hábitos não feitos</div></div>'+
      '<div class="stat"><div class="num">'+state.habits.length+'</div><div class="lbl">Hábitos ativos</div></div>';
  }

  function render(){
    ensureMonthOptions();
    var parts = state.currentMonth.split("-");
    var y = parseInt(parts[0],10), m = parseInt(parts[1],10)-1;
    var nd = daysInMonth(y,m);
    var todayStr = monthKey(now.getFullYear(), now.getMonth());
    var todayDay = now.getDate();

    var table = document.getElementById("board");
    var html = "<thead><tr><th>Hábito</th>";
    for(var d=1; d<=nd; d++){
      var isToday = (state.currentMonth === todayStr && d === todayDay);
      html += '<th class="daynum'+(isToday?' today':'')+'">'+d+'</th>';
    }
    html += '<th class="del-col"></th></tr></thead><tbody>';

    state.habits.forEach(function(h){
      html += '<tr>';
      html += '<th class="habitname"><input class="habit-name-input" data-hid="'+h.id+'" value="'+h.name.replace(/"/g,'&quot;')+'"><div class="rowmeta" data-hid="'+h.id+'"></div></th>';
      for(var d2=1; d2<=nd; d2++){
        var v = getMark(h.id, d2);
        html += '<td class="cell"><div class="dot '+v+'" role="button" tabindex="0" aria-label="Dia '+d2+', '+h.name+'" data-hid="'+h.id+'" data-day="'+d2+'">'+d2+'</div></td>';
      }
      html += '<td class="del-col"><button class="del-btn" data-hid="'+h.id+'" title="Remover hábito">&times;</button></td>';
      html += '</tr>';
    });
    html += '</tbody>';
    table.innerHTML = html;

    paintTotals(nd);

    table.querySelectorAll(".dot").forEach(function(el){
      function toggle(){
        var hid = el.getAttribute("data-hid"), day = el.getAttribute("data-day");
        var nv = cycle(getMark(hid, day));
        setMark(hid, day, nv);
        el.className = "dot " + nv;
        paintTotals(nd);
      }
      el.addEventListener("click", toggle);
      el.addEventListener("keydown", function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggle(); } });
    });
    table.querySelectorAll(".habit-name-input").forEach(function(inp){
      inp.addEventListener("change", function(){
        var hid = inp.getAttribute("data-hid");
        var h = state.habits.find(function(x){return x.id===hid;});
        if(h){ h.name = inp.value.trim() || h.name; saveState(); render(); }
      });
    });
    table.querySelectorAll(".del-btn").forEach(function(btn){
      btn.addEventListener("click", function(){
        var hid = btn.getAttribute("data-hid");
        state.habits = state.habits.filter(function(x){return x.id!==hid;});
        saveState(); render();
      });
    });
  }

  document.getElementById("addHabitBtn").addEventListener("click", function(){
    var inp = document.getElementById("newHabit");
    var name = inp.value.trim();
    if(!name) return;
    state.habits.push({id:"h"+Date.now(), name:name});
    inp.value = "";
    saveState(); render();
  });
  document.getElementById("newHabit").addEventListener("keydown", function(e){
    if(e.key === "Enter"){ document.getElementById("addHabitBtn").click(); }
  });
  document.getElementById("resetMonth").addEventListener("click", function(){
    delete state.marks[state.currentMonth];
    saveState(); render();
  });

  render();
})();
</script>

</body>
</html>
